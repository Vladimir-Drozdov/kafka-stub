server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
  servlet:
    async:
      request-timeout: 60000

spring:
  application:
    name: kafka-stub

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 3000
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000

    consumer:
      group-id: kafka-stub-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # earliest = читать с самого начала топика.
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://localhost:5432/kafka_stub_db
    username: postgres
    password: 1456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        # prometheus - отдельный endpoint /actuator/prometheus, который Prometheus-сервер периодически опрашивает (scrape) для сбора метрик.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Тег application добавляется к каждой метрике - это удобно, если в одном Prometheus собираются метрики нескольких сервисов, чтобы отличать их друг от друга в Grafana.
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

app:
  kafka:
    topic: postedmessages